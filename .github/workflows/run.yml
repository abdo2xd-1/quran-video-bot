name: 4x Daily Quran Shorts Engine

on:
  workflow_dispatch:
  schedule:
    # يعمل كل ساعتين بانتظام
    - cron: '23 */2 * * *'

permissions:
  contents: write

jobs:
  produce-and-save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg and Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg google-chrome-stable

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Quran Engine
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        DAILYMOTION_KEY: ${{ secrets.DAILYMOTION_KEY }}
        DAILYMOTION_SECRET: ${{ secrets.DAILYMOTION_SECRET }}
        DAILYMOTION_USERNAME: ${{ secrets.DAILYMOTION_USERNAME }}
        DAILYMOTION_PASSWORD: ${{ secrets.DAILYMOTION_PASSWORD }}
      run: |
        python -u main.py

    - name: Commit & Push History
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history_shorts_all.json surahs_114_meta.json || true
        git commit -m "Auto-update shorts history [skip ci]" || echo "No changes to commit"
        git push || true
