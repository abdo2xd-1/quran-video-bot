name: 4x Daily Quran Shorts Engine

on:
  schedule:
    # 4 مواعيد يومية (توقيت مصر/السعودية: 6:30 ص، 1:30 ظ، 6:30 م، 10:30 م)
    - cron: '30 4,11,16,20 * * *'
  workflow_dispatch:

jobs:
  produce-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # صلاحية حفظ ملف history.json في المستودع

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests "moviepy==1.0.3" "Pillow<10"

      - name: Run Quran Engine
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u main.py

      # حفظ وتحديث سجل الفيديوهات المنشورة في المستودع لمنع التكرار نهائياً
      - name: Commit & Push History Registry
        run: |
          git config --global user.name "quran-bot-automation"
          git config --global user.email "bot@github-actions.local"
          git pull --rebase origin main || true
          git add history.json surahs_meta.json || true
          git commit -m "Auto-update: Register published Quran clip [skip ci]" || echo "No changes to commit"
          git push origin main || true
