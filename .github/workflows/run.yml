name: Daily Quran Publisher (1 Video Per Day)

on:
  schedule:
    # يعمل مرة واحدة يومياً في تمام الساعة 6:00 مساءً بتوقيت مصر (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت بضغطة زر

jobs:
  publish-daily-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser fonts-amiri

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests moviepy Pillow

      - name: Run Production & Publish (1 Video)
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          WATERMARK_HANDLE: ${{ secrets.WATERMARK_HANDLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py
