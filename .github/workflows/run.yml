name: Quran Video Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg google-chrome-stable

      - name: Install Python Requirements
        run: |
          pip install moviepy==1.0.3 requests Pillow

      - name: Run Quran Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DAILYMOTION_KEY: ${{ secrets.DAILYMOTION_KEY }}
          DAILYMOTION_SECRET: ${{ secrets.DAILYMOTION_SECRET }}
          DAILYMOTION_USERNAME: ${{ secrets.DAILYMOTION_USERNAME }}
          DAILYMOTION_PASSWORD: ${{ secrets.DAILYMOTION_PASSWORD }}
        run: python -u main.py
