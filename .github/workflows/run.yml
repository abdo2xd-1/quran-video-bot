name: Quran Publisher (Friday 1PM & Daily 6PM)

on:
  schedule:
    # يوم الجمعة الساعة 1:10 ظهراً بتوقيت مصر (10:10 UTC - لتجنب ضغط السيرفرات)
    - cron: '10 10 * * 5'
    
    # باقي الأيام الساعة 6:10 مساءً بتوقيت مصر (15:10 UTC)
    - cron: '10 15 * * 0,1,2,3,4,6'

  workflow_dispatch:
jobs:
  publish-scheduled-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests "moviepy==1.0.3" "Pillow<10" imageio-ffmpeg

      - name: Run Auto Publisher
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          WATERMARK_HANDLE: ${{ secrets.WATERMARK_HANDLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py
