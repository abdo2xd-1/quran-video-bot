name: 4x Daily Quran Shorts Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

# صلاحيات لكتابة الكود والـ Releases
permissions:
  contents: write

jobs:
  produce-and-save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Chrome, FFmpeg, ImageMagick, Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable ffmpeg imagemagick fonts-hosny-amiri
        sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-*/policy.xml || true

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Quran Engine
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        FEBSPOT_EMAIL: ${{ secrets.FEBSPOT_EMAIL }}
        FEBSPOT_PASSWORD: ${{ secrets.FEBSPOT_PASSWORD }}
        COSTV_EMAIL: ${{ secrets.COSTV_EMAIL }}
        COSTV_PASSWORD: ${{ secrets.COSTV_PASSWORD }}
        DM_API_KEY: ${{ secrets.DM_API_KEY }}
        DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
        ODYSEE_TOKEN: ${{ secrets.ODYSEE_TOKEN }}
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      run: |
        python -u main.py

    - name: Commit & Push History
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history.json surahs_meta.json || true
        git commit -m "Auto-update history and meta cache [skip ci]" || echo "No changes to commit"
        git push || true
