name: 4x Daily Quran Shorts Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *' 

jobs:
  produce-and-save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Chrome for Selenium
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Quran Engine
      env:
        # يوتيوب
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # ديلي موشن
        DM_API_KEY: ${{ secrets.DM_API_KEY }}
        DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
        DM_USERNAME: ${{ secrets.DM_USERNAME }}
        DM_PASSWORD: ${{ secrets.DM_PASSWORD }}
        # تويتر / إكس
        TWITTER_API_KEY: ${{ secrets.X_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.X_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        # المنصات المباشرة
        FEBSPOT_EMAIL: ${{ secrets.FEBSPOT_EMAIL }}
        FEBSPOT_PASSWORD: ${{ secrets.FEBSPOT_PASSWORD }}
        COSTV_EMAIL: ${{ secrets.COSTV_EMAIL }}
        COSTV_PASSWORD: ${{ secrets.COSTV_PASSWORD }}
        # مفاتيح الإنتاج الأساسية
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python -u main.py
