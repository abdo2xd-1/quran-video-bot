name: Quran Landscape Engine

on:
  workflow_dispatch:
  schedule:
    # يعمل كل ساعة بانتظام
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  produce-and-save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Chrome, FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable ffmpeg

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Quran Landscape Engine
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      run: |
        python -u main.py

    - name: Commit & Push History
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history_parts.json || true
        git commit -m "Auto-update parts history [skip ci]" || echo "No changes to commit"
        git push || true
