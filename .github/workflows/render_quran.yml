name: Render Quran Videos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri
          pip install mutagen yt-dlp

      - name: Generate Quran Video
        run: |
          ffmpeg -y -f lavfi -i "color=c=#090d16:s=720x1280:r=30" -t 15 -c:v libx264 -pix_fmt yuv420p bg.mp4
          mkdir -p output
          echo "تم إنشاء الخلفية بنجاح"

      - name: Upload Output Video
        uses: actions/upload-artifact@v4
        with:
          name: quran-video-output
          path: bg.mp4
