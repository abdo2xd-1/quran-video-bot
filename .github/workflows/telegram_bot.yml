name: 24/7 Telegram Quran Bot

on:
  schedule:
    # إعادة تشغيل تلقائية كل 5 ساعات لضمان استمراره 24/7
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # حد التشغيل 5 ساعات كاملة (300 دقيقة)
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # تثبيت ffmpeg فقط خلال 15 ثانية وتخطي حزم الخطوط الثقيلة
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: |
          pip install --upgrade pip
          pip install requests "moviepy==1.0.3" "Pillow<10" python-telegram-bot edge-tts gTTS

      - name: Start Telegram Bot Listener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u bot.py

      - name: Auto-Restart Workflow
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "24/7 Telegram Quran Bot" --ref main || true
